<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VusCut</title>
<style>
html,body{margin:0;height:100%;background:#0f0f0f;color:#e6e6e6;font:14px system-ui,sans-serif}
#boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
#boot.hide{display:none}
#bar{width:220px;height:5px;background:#252525;border-radius:3px;overflow:hidden}
#bar i{display:block;height:100%;width:30%;background:#4a9cff;animation:s 1.1s ease-in-out infinite}
@keyframes s{0%{margin-left:-30%}100%{margin-left:100%}}
#err{color:#ff8080;max-width:520px;text-align:center}
</style>
</head>
<body>
<div id="boot"><b style="font-size:20px">VusCut</b><div id="bar"><i></i></div><div id="msg">Loading editor…</div></div>
<div id="root"></div>
<script type="module">
// Where the built app lives. Pin REF to a tag or commit (e.g. "v0.4.1") for stable
// releases; "main" can be cached by the CDN for a few hours.
const REF = "main";
const DEFAULT_BASE = `https://cdn.jsdelivr.net/gh/mini-manz/VusCut@${REF}/dist/`;
const q = new URLSearchParams(location.search);
let base = q.get("src") || DEFAULT_BASE;
if (!base.endsWith("/")) base += "/";

const boot = document.getElementById("boot");
const msg = document.getElementById("msg");
try {
  const css = document.createElement("link");
  css.rel = "stylesheet";
  css.href = base + "app.css";
  document.head.append(css);
  await import(base + "app.js");
  boot.classList.add("hide");
} catch (e) {
  console.error(e);
  document.getElementById("bar").remove();
  msg.id = "err";
  msg.textContent = "Could not load VusCut: " + (e && e.message ? e.message : e);
}
</script>
</body>
</html>
